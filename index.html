<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeLab – Trading Simulator</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080c12;
    color:#e9eef5;
    font-family:Arial,Helvetica,sans-serif;
}

button,input,select{
    font:inherit;
}

.topbar{
    height:68px;
    background:#0d131b;
    border-bottom:1px solid #202a35;
    display:flex;
    align-items:center;
    padding:0 22px;
    gap:20px;
}

.logo{
    width:38px;
    height:38px;
    border-radius:10px;
    background:white;
    color:#080c12;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-title{
    font-weight:bold;
    font-size:17px;
}

.brand-sub{
    color:#778392;
    font-size:12px;
}

.demo{
    margin-left:auto;
    color:#6f7c89;
    font-size:11px;
    letter-spacing:1px;
}

.reset{
    background:#151c25;
    color:white;
    border:1px solid #293541;
    padding:9px 13px;
    border-radius:8px;
    cursor:pointer;
}

.reset:hover{
    background:#202a35;
}

.layout{
    display:flex;
    min-height:calc(100vh - 68px);
}

.sidebar{
    width:210px;
    background:#0c1219;
    border-right:1px solid #202a35;
    padding:18px 12px;
}

.nav{
    width:100%;
    background:transparent;
    border:1px solid transparent;
    color:#8793a1;
    padding:12px;
    margin-bottom:5px;
    text-align:left;
    border-radius:8px;
    cursor:pointer;
}

.nav:hover,
.nav.active{
    background:#171f29;
    color:white;
    border-color:#222e39;
}

.sidebox{
    margin-top:30px;
    padding:14px;
    border:1px solid #202a35;
    border-radius:10px;
    color:#74808e;
    font-size:12px;
    line-height:1.7;
}

.sidebox strong{
    color:white;
    font-size:17px;
}

main{
    flex:1;
    padding:25px;
    max-width:1500px;
    margin:auto;
}

h1{
    margin:0 0 5px;
    font-size:27px;
}

.muted{
    color:#75818f;
}

.notice{
    margin:18px 0;
    padding:12px 15px;
    background:#121a22;
    border:1px solid #26323e;
    border-radius:9px;
    color:#929daa;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
}

.card{
    background:#10171f;
    border:1px solid #202a35;
    border-radius:11px;
    padding:18px;
}

.card-label{
    color:#75818e;
    font-size:12px;
    margin-bottom:9px;
}

.big{
    font-size:23px;
    font-weight:bold;
}

.green{
    color:#40d18f;
}

.red{
    color:#ff6572;
}

.grid{
    display:grid;
    grid-template-columns:1.7fr 1fr;
    gap:15px;
}

.panel{
    background:#10171f;
    border:1px solid #202a35;
    border-radius:11px;
    overflow:hidden;
}

.panel-head{
    padding:15px 17px;
    border-bottom:1px solid #202a35;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.panel-head h2{
    margin:0;
    font-size:14px;
}

.markets{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:12px;
}

.market{
    background:#0d141b;
    border:1px solid #222d38;
    padding:15px;
    border-radius:9px;
    cursor:pointer;
    transition:.15s;
}

.market:hover{
    border-color:#52606d;
    transform:translateY(-1px);
}

.market-top{
    display:flex;
    justify-content:space-between;
}

.market-name{
    font-weight:bold;
}

.market-symbol{
    color:#687583;
    font-size:11px;
}

.market-price{
    font-size:18px;
    margin-top:9px;
}

.market-live{
    color:#40d18f;
    font-size:11px;
    margin-top:4px;
}

.chart-container{
    padding:12px;
}

canvas{
    width:100%;
    height:410px;
    background:#0b1117;
    border-radius:8px;
    display:block;
}

.timeframes{
    display:flex;
    gap:5px;
}

.timeframes button{
    background:#151d26;
    border:1px solid #293541;
    color:#8c98a5;
    border-radius:6px;
    padding:6px 9px;
    cursor:pointer;
    font-size:11px;
}

.timeframes button:hover,
.timeframes button.selected{
    color:white;
    background:#26313c;
}

.tradebox{
    padding:17px;
}

.side-buttons{
    display:flex;
    gap:7px;
    margin-bottom:15px;
}

.side-buttons button{
    flex:1;
    padding:11px;
    border-radius:8px;
    background:#151c24;
    color:#aab4bf;
    border:1px solid #293541;
    cursor:pointer;
}

.side-buttons .long.selected{
    background:#163b2d;
    border-color:#2a8d64;
    color:#59dda1;
}

.side-buttons .short.selected{
    background:#422027;
    border-color:#a84552;
    color:#ff818b;
}

label{
    display:block;
    color:#818d9a;
    font-size:12px;
    margin-bottom:6px;
}

input,select{
    width:100%;
    background:#0b1117;
    color:white;
    border:1px solid #293541;
    padding:10px;
    border-radius:8px;
    outline:none;
}

.field{
    margin-bottom:13px;
}

.summary{
    background:#0c1218;
    border:1px solid #202a35;
    border-radius:8px;
    padding:11px;
    color:#87939f;
    font-size:12px;
    line-height:1.9;
    margin-bottom:13px;
}

.summary b{
    color:white;
}

.open{
    width:100%;
    border:0;
    border-radius:8px;
    padding:12px;
    background:white;
    color:#080c12;
    font-weight:bold;
    cursor:pointer;
}

.open:hover{
    background:#dce3ea;
}

.ghost{
    background:#151c24;
    color:white;
    border:1px solid #293541;
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
}

.table{
    width:100%;
    border-collapse:collapse;
}

.table th,
.table td{
    padding:12px;
    text-align:left;
    border-bottom:1px solid #202a35;
    font-size:12px;
}

.table th{
    color:#72808d;
}

.close{
    background:#171f28;
    color:white;
    border:1px solid #303c48;
    border-radius:6px;
    padding:6px 9px;
    cursor:pointer;
}

.empty{
    text-align:center;
    padding:35px;
    color:#778492;
}

#toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:white;
    color:#080c12;
    padding:12px 17px;
    border-radius:8px;
    font-weight:bold;
    opacity:0;
    transform:translateY(10px);
    transition:.2s;
    z-index:1000;
}

#toast.show{
    opacity:1;
    transform:translateY(0);
}

@media(max-width:950px){

    .sidebar{
        width:170px;
    }

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:650px){

    .sidebar{
        display:none;
    }

    .topbar{
        padding:0 12px;
    }

    .demo{
        display:none;
    }

    main{
        padding:14px;
    }

    .cards{
        grid-template-columns:1fr 1fr;
    }

    .markets{
        grid-template-columns:1fr;
    }

    canvas{
        height:280px;
    }
}
</style>

<style id="player-system-css">
.player-panel{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:9999;
    display:flex; align-items:center; justify-content:center; padding:20px;
}
.player-card{
    width:min(680px,100%); max-height:90vh; overflow:auto;
    background:#111827; color:#fff; border:1px solid #334155;
    border-radius:18px; padding:24px; box-shadow:0 20px 70px rgba(0,0,0,.45);
}
.player-card h2{margin:0 0 8px}
.player-card p{color:#94a3b8}
.player-row{display:flex;gap:10px;align-items:center;margin:14px 0}
.player-row input{
    flex:1; padding:11px 12px; border-radius:10px; border:1px solid #475569;
    background:#0f172a; color:#fff;
}
.player-btn{
    border:0; border-radius:10px; padding:11px 14px; cursor:pointer;
    background:#2563eb; color:#fff; font-weight:700;
}
.player-btn.secondary{background:#334155}
.player-stats{
    display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:18px 0;

.player-stat{

.player-stat b{display:block;font-size:20px;margin-top:4px}
.leaderboard{

.lb-row{

</style>

</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="logo">
            TL
        </div>

        <div>
            <div class="brand-title">
                TradeLab
            </div>

            <div class="brand-sub">
                Trading Simulator
            </div>
        </div>

    </div>

    <div class="demo">
        ● SIMULATION – KEIN ECHTES GELD
    </div>

    <button class="reset" onclick="resetAccount()">
        Reset Account
    </button>

</header>


<div class="layout">

<aside class="sidebar">

    <button class="nav active" onclick="showDashboard(this)">
        🏠 Dashboard
    </button>

    <button class="nav" onclick="showMarkets(this)">
        📊 Märkte
    </button>

    <button class="nav" onclick="showPositions(this)">
        💼 Positionen
    </button>

    <button class="nav" onclick="showHistory(this)">
        📜 Historie
    </button>

    <div class="sidebox">
        Virtuelles Startkapital
        <br>
        <strong>100,00 €</strong>
    </div>

</aside>

<main id="app"></main>

</div>

<div id="toast"></div>


<script>

/* =========================
   MARKETS
========================= */

const markets = {

    BTC:{
        name:"Bitcoin",
        symbol:"BTC/USD",
        price:62400,
        volatility:0.008
    },

    ETH:{
        name:"Ethereum",
        symbol:"ETH/USD",
        price:2580,
        volatility:0.010
    },

    AAPL:{
        name:"Apple",
        symbol:"AAPL",
        price:229,
        volatility:0.004
    },

    NVDA:{
        name:"NVIDIA",
        symbol:"NVDA",
        price:178,
        volatility:0.010
    },

    TSLA:{
        name:"Tesla",
        symbol:"TSLA",
        price:338,
        volatility:0.013
    },

    GOLD:{
        name:"Gold",
        symbol:"XAU/USD",
        price:3440,
        volatility:0.003
    },

    SPX:{
        name:"S&P 500",
        symbol:"SPX",
        price:6460,
        volatility:0.002
    },

    EUR:{
        name:"EUR/USD",
        symbol:"EUR/USD",
        price:1.17,
        volatility:0.0015
    }

};

/* Feste Ausgangspreise für einen echten Reset. */
Object.keys(markets).forEach(key=>{
    markets[key].startPrice = markets[key].price;
});


/* =========================
   ACCOUNT
========================= */

let saved =
    JSON.parse(localStorage.getItem("tradelab"));

let state = saved || {

    cash:100,

    positions:[],

    history:[],

    selected:"BTC"

};

let currentView = "dashboard";

let currentSide = "long";

let currentTimeframe = "1M";


/* =========================
   CANDLE DATA
========================= */

const timeframeSizes = {

    "1M":1,
    "5M":5,
    "15M":15,
    "1H":60,
    "1D":1440

};


const histories = {};
const MARKET_DATA_KEY = "tradelab_marketdata_v2";

/*
   WICHTIG:
   Die simulierten Kurse/Kerzen werden gespeichert.
   Dadurch erzeugt ein Reload NICHT wieder einen komplett
   neuen Markt.
*/

function saveMarketData(){

    const snapshot = {};

    Object.keys(markets).forEach(key=>{

        snapshot[key] = {
            price: markets[key].price,
            candles: histories[key] || []
        };

    });

    localStorage.setItem(
        MARKET_DATA_KEY,
        JSON.stringify(snapshot)
    );

}


function createHistory(key){

    const m = markets[key];

    let p = m.price;

    const data = [];

    for(let i=0;i<2000;i++){

        const open = p;

        const movement =
            (Math.random()-0.49)
            * m.volatility;

        const close =
            Math.max(
                0.0001,
                open * (1+movement)
            );

        const high =
            Math.max(open,close)
            *
            (1+Math.random()*m.volatility);

        const low =
            Math.min(open,close)
            *
            (1-Math.random()*m.volatility);

        data.push({
            open,
            close,
            high,
            low
        });

        p = close;
    }

    m.price = p;
    histories[key] = data;

}


function loadMarketData(){

    let savedMarkets = null;

    try{
        savedMarkets =
            JSON.parse(
                localStorage.getItem(MARKET_DATA_KEY) || "null"
            );
    }catch(e){
        savedMarkets = null;
    }

    Object.keys(markets).forEach(key=>{

        const savedMarket =
            savedMarkets && savedMarkets[key];

        if(
            savedMarket &&
            Array.isArray(savedMarket.candles) &&
            savedMarket.candles.length > 0
        ){

            histories[key] = savedMarket.candles;

            const last =
                histories[key][histories[key].length-1];

            if(last && Number.isFinite(Number(last.close))){
                markets[key].price = Number(last.close);
            }else{
                markets[key].price = Number(savedMarket.price) || markets[key].price;
            }

        }else{

            createHistory(key);

        }

    });

}


loadMarketData();


/* =========================
   HELPERS
========================= */

function save(){

    localStorage.setItem(
        "tradelab",
        JSON.stringify(state)
    );

}


function money(value){

    return new Intl.NumberFormat(
        "de-DE",
        {
            style:"currency",
            currency:"EUR"
        }
    ).format(value);

}


function formatPrice(value){

    if(value < 10){

        return value.toFixed(4);

    }

    return value.toLocaleString(
        "de-DE",
        {
            maximumFractionDigits:2
        }
    );

}


function notify(text){

    const toast =
        document.getElementById("toast");

    toast.textContent = text;

    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },1800);

}


function totalPnL(){

    return state.positions.reduce(
        (sum,p)=>{
            return sum + getPnL(p);
        },
        0
    );

}


function invested(){

    return state.positions.reduce(
        (sum,p)=>{
            return sum + p.margin;
        },
        0
    );

}


function accountValue(){

    return state.cash
    + invested()
    + totalPnL();

}


function getPnL(position){

    const current =
        markets[position.market].price;

    const movement =
        (current-position.entry)
        /position.entry;

    if(position.side === "long"){

        return position.margin
        * position.leverage
        * movement;

    }

    return position.margin
    * position.leverage
    * (-movement);

}


/* =========================
   NAVIGATION
========================= */

function setActive(button){

    document
    .querySelectorAll(".nav")
    .forEach(b=>{
        b.classList.remove("active");
    });

    if(button){

        button.classList.add("active");

    }

}


function showDashboard(button){

    currentView = "dashboard";

    setActive(button);

    renderDashboard();

}


function showMarkets(button){

    currentView = "markets";

    setActive(button);

    renderMarkets();

}


function showPositions(button){

    currentView = "positions";

    setActive(button);

    renderPositions();

}


function showHistory(button){

    currentView = "history";

    setActive(button);

    renderHistory();

}


/* =========================
   DASHBOARD
========================= */

function marketCards(){

    return Object.entries(markets)
    .map(([key,m])=>`

        <div class="market"
             onclick="openMarket('${key}')">

            <div class="market-top">

                <span class="market-name">
                    ${m.name}
                </span>

                <span class="market-symbol">
                    ${m.symbol}
                </span>

            </div>

            <div class="market-price">
                ${formatPrice(m.price)}
            </div>

            <div class="market-live">
                ● LIVE – SIMULIERT
            </div>

        </div>

    `).join("");

}


function renderDashboard(){

    document.getElementById("app").innerHTML = `

        <h1>Dashboard</h1>

        <div class="muted">
            Dein virtuelles Trading-Konto
        </div>

        <div class="notice">
            Simulation – alle Kurse und Ergebnisse
            sind virtuell. Es wird kein echtes Geld verwendet.
        </div>

        <div class="cards">

            <div class="card">

                <div class="card-label">
                    Gesamtwert
                </div>

                <div class="big" id="totalValue">
                    ${money(accountValue())}
                </div>

            </div>

            <div class="card">

                <div class="card-label">
                    Verfügbares Guthaben
                </div>

                <div class="big" id="cashValue">
                    ${money(state.cash)}
                </div>

            </div>

            <div class="card">

                <div class="card-label">
                    Offene Positionen
                </div>

                <div class="big" id="positionCount">
                    ${state.positions.length}
                </div>

            </div>

            <div class="card">

                <div class="card-label">
                    Unrealisierter P/L
                </div>

                <div class="big ${
                    totalPnL() >= 0
                    ? "green"
                    : "red"
                }" id="totalPnl">

                    ${money(totalPnL())}

                </div>

            </div>

        </div>

        <div class="grid">

            <div class="panel">

                <div class="panel-head">

                    <h2>
                        Märkte
                    </h2>

                    <button
                        class="ghost"
                        onclick="goMarkets()">

                        Alle anzeigen

                    </button>

                </div>

                <div class="markets">
                    ${marketCards()}
                </div>

            </div>

            <div class="panel">

                <div class="panel-head">

                    <h2>
                        Offene Positionen
                    </h2>

                </div>

                ${
                    state.positions.length
                    ?
                    positionTable()
                    :
                    `<div class="empty">
                        Keine offenen Positionen.
                    </div>`
                }

            </div>

        </div>
    `;

}


function goMarkets(){

    showMarkets(
        document.querySelectorAll(".nav")[1]
    );

}


/* =========================
   MARKETS
========================= */

function renderMarkets(){

    document.getElementById("app").innerHTML = `

        <h1>Märkte</h1>

        <div class="muted">
            Wähle einen simulierten Markt
        </div>

        <div
            class="markets"
            style="margin-top:18px">

            ${marketCards()}

        </div>

    `;

}


/* =========================
   POSITIONS
========================= */

function positionTable(){

    return `

    <table class="table">

        <thead>

            <tr>

                <th>Markt</th>
                <th>Seite</th>
                <th>Einstieg</th>
                <th>Aktuell</th>
                <th>Hebel</th>
                <th>P/L</th>
                <th></th>

            </tr>

        </thead>

        <tbody>

        ${
            state.positions.map((p,i)=>{

                const m =
                    markets[p.market];

                const pnl =
                    getPnL(p);

                return `

                <tr>

                    <td>
                        <b>${m.name}</b>
                        <br>
                        <span class="muted">
                            ${m.symbol}
                        </span>
                    </td>

                    <td class="${
                        p.side==="long"
                        ? "green"
                        : "red"
                    }">

                        ${
                            p.side==="long"
                            ? "LONG"
                            : "SHORT"
                        }

                    </td>

                    <td>
                        ${formatPrice(p.entry)}
                    </td>

                    <td>
                        ${formatPrice(m.price)}
                    </td>

                    <td>
                        ${p.leverage}×
                    </td>

                    <td class="${
                        pnl>=0
                        ? "green"
                        : "red"
                    }">

                        ${money(pnl)}

                    </td>

                    <td>

                        <button
                            class="close"
                            onclick="closePosition(${i})">

                            Schließen

                        </button>

                    </td>

                </tr>

                `;

            }).join("")
        }

        </tbody>

    </table>

    `;

}


function renderPositions(){

    document.getElementById("app").innerHTML = `

        <h1>Positionen</h1>

        <div class="muted">
            Deine offenen Trades
        </div>

        <div
            class="panel"
            style="margin-top:18px">

            ${
                state.positions.length
                ?
                positionTable()
                :
                `<div class="empty">
                    Noch keine offenen Positionen.
                </div>`
            }

        </div>

    `;

}


/* =========================
   HISTORY
========================= */

function renderHistory(){

    document.getElementById("app").innerHTML = `

        <h1>Trade-Historie</h1>

        <div class="muted">
            Deine abgeschlossenen Trades
        </div>

        <div
            class="panel"
            style="margin-top:18px">

        ${
            state.history.length
            ?

            `<table class="table">

                <thead>

                    <tr>

                        <th>Zeit</th>

/* =========================
   CHART
========================= */

function getAggregatedCandles(key,tf){

    const source =
        histories[key];

    const size =
        timeframeSizes[tf];

    const result = [];

    for(
        let i=0;
        i<source.length;
        i+=size
    ){

        const group =
            source.slice(i,i+size);

        if(!group.length) continue;

        result.push({

            open:
                group[0].open,

            close:
                group[group.length-1].close,

            high:
                Math.max(
                    ...group.map(x=>x.high)
                ),

            low:
                Math.min(
                    ...group.map(x=>x.low)
                )

        });

    }

    return result.slice(-80);

}


function drawChart(){

    const canvas =
        document.getElementById("chart");

    if(!canvas) return;

    const rect =
        canvas.getBoundingClientRect();

    const ratio =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * ratio;

    canvas.height =
        rect.height * ratio;

    const ctx =
        canvas.getContext("2d");

    ctx.scale(ratio,ratio);

    const data =
        getAggregatedCandles(
            state.selected,
            currentTimeframe
        );

    if(!data.length) return;

    const min =
        Math.min(...data.map(c=>c.low));

    const max =
        Math.max(...data.map(c=>c.high));

    const range =
        max-min || 1;

    const width =
        rect.width;

    const height =
        rect.height;


    function y(value){

        return height
        - 25
        -
        (
            (value-min)/range
        )
        *
        (height-45);

    }


    /* Grid */

    ctx.strokeStyle = "#1b252f";

    ctx.lineWidth = 1;

    for(let i=1;i<6;i++){

        const yy =
            height*i/6;

        ctx.beginPath();

        ctx.moveTo(0,yy);

        ctx.lineTo(width,yy);

        ctx.stroke();

    }


    /* Candles */

    const step =
        width/data.length;

    data.forEach((candle,index)=>{

        const x =
            index*step
            +
            step/2;

        const candleWidth =
            Math.max(
                2,
                step*0.6
            );

        const openY =
            y(candle.open);

        const closeY =
            y(candle.close);

        const highY =
            y(candle.high);

        const lowY =
            y(candle.low);

        const bullish =
            candle.close >= candle.open;

        ctx.strokeStyle =
            bullish
            ? "#40d18f"
            : "#ff6572";

        ctx.fillStyle =
            ctx.strokeStyle;


        /* Wick */

        ctx.beginPath();

        ctx.moveTo(x,highY);

        ctx.lineTo(x,lowY);

        ctx.stroke();


        /* Body */

        ctx.fillRect(

            x-candleWidth/2,

            Math.min(
                openY,
                closeY
            ),

            candleWidth,

            Math.max(
                2,
                Math.abs(
                    closeY-openY
                )
            )

        );

    });


    /* Current price line */

    const current =
        markets[state.selected].price;

    const currentY =
        y(current);

    ctx.strokeStyle =
        "#7d8a98";

    ctx.setLineDash([5,5]);

    ctx.beginPath();

    ctx.moveTo(
        0,
        currentY
    );

    ctx.lineTo(
        width,
        currentY
    );

    ctx.stroke();

    ctx.setLineDash([]);

}

/* =========================
   LIQUIDATION
========================= */

function checkLiquidations(){

    for(
        let i=state.positions.length-1;
        i>=0;
        i--
    ){

        const p =
            state.positions[i];

        const movement =
            (
                markets[p.market].price
                -
                p.entry
            )
            /
            p.entry;

        const loss =
            p.side==="long"
            ? -movement
            : movement;

        const liquidationLevel =
            Math.max(
                0.035,
                0.9/p.leverage
            );

        if(loss>=liquidationLevel){

            const pnl =
                getPnL(p);

            state.history.push({

                time:
                    new Date().toLocaleString(
                        "de-DE"
                    ),

                market:
                    markets[p.market].name,

                side:
                    p.side,

                entry:
                    p.entry,

                exit:
                    markets[p.market].price,

                leverage:
                    p.leverage,

                pnl:
                    pnl

            });

            state.positions.splice(i,1);

            notify(
                "Position liquidiert."
            );

        }

    }

}


/* =========================
   SIMULATED MARKET
========================= */

function updatePrices(){

    Object.entries(markets)
    .forEach(([key,m])=>{

        const old =
            m.price;

        const movement =
            (
                Math.random()-0.49
            )
            *
            m.volatility;

        m.price =
            Math.max(
                0.0001,
                old*(1+movement)
            );


        /*
           Jeder Tick entspricht
           einer simulierten Minute.
        */

        const open =
            old;

        const close =
            m.price;

        const high =
            Math.max(open,close)
            *
            (
                1+
                Math.random()
                *
                m.volatility
                *
                0.5
            );

        const low =
            Math.min(open,close)
            *
            (
                1-
                Math.random()
                *
                m.volatility
                *
                0.5
            );

        histories[key].push({

            open,
            close,
            high,
            low

        });

        if(
            histories[key].length>2500
        ){

            histories[key].shift();

        }

    });


    checkLiquidations();

    save();
    saveMarketData();

    updateTradePage();

    updateDashboardLive();

}

  1. Create a Supabase project.

       id text primary key,

       updated_at timestamptz not null default now()
     );
  3. Put your project URL + publishable/anon key here.
  4. Configure RLS so players may read the leaderboard and update only their
     own row. Never put a Supabase service-role/secret key into this file.
*/
let SUPABASE_URL = localStorage.getItem("tradelab_supabase_url") || "";
let SUPABASE_KEY = localStorage.getItem("tradelab_supabase_key") || "";

function saveSupabaseSettings(){
    SUPABASE_URL =
        (document.getElementById("supabaseUrlInput")?.value || "").trim();

    SUPABASE_KEY =
        (document.getElementById("supabaseKeyInput")?.value || "").trim();

    localStorage.setItem("tradelab_supabase_url", SUPABASE_URL);
    localStorage.setItem("tradelab_supabase_key", SUPABASE_KEY);

    notify(
        SUPABASE_URL && SUPABASE_KEY
        ? "Online-Rangliste konfiguriert."
        : "Online-Rangliste deaktiviert."
    );

    openPlayerPanel();
}

async function supabaseClient(){

    if(!SUPABASE_URL || !SUPABASE_KEY){
        return null;
    }

    if(!window.supabase){

        await new Promise((resolve,reject)=>{

            const s =
                document.createElement("script");

            s.src =
                "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

            s.onload = resolve;
            s.onerror = reject;

            document.head.appendChild(s);

        }).catch(()=>null);

    }

    if(!window.supabase){
        return null;
    }

    return window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

}


async function syncPlayer(){

    const client =
        await supabaseClient();

    if(!client){
        return;
    }

    const player =
        getPlayer();

    const {error} =
        await client
            .from("tradelab_players")
            .upsert({
                id:getPlayerId(),
                name:player.name,
                points:Number(player.points || 0),
                updated_at:new Date().toISOString()
            });

    if(error){
        console.warn("Leaderboard sync:",error.message);
    }

}

          <div class="lb-row">
            <span>1</span>
            <span>${escapeHtml(p.name)}</span>
            <span>${Number(p.points || 0)}</span>
          </div>
        `;

        return;

    }

    const result =
        await client
            .from("tradelab_players")
            .select("name,points")
            .order("points",{ascending:false})
            .limit(50);

    if(result.error){

        box.innerHTML = `
          <div class="lb-row">
            <span>–</span>
            <span>Rangliste nicht erreichbar. Prüfe Supabase/RLS.</span>
            <span>–</span>
          </div>
        `;

        return;

    }

    box.innerHTML =
        (result.data || [])
            .map((p,i)=>`
              <div class="lb-row">
                <span>${i+1}</span>
                <span>${escapeHtml(p.name)}</span>
                <span>${Number(p.points || 0)}</span>
              </div>
            `)
            .join("")
        ||
        `
          <div class="lb-row">
            <span>–</span>
            <span>Noch keine Spieler</span>
            <span>–</span>
          </div>
        `;

}


function awardPracticePoint(){

    /*
       Ein abgeschlossener Übungstrade gibt genau einen
       Lernpunkt. Der Punkt wird im Account gespeichert und
       anschließend online synchronisiert.
    */

    addLearningPoint();
    syncPlayer();

}


/* Ask for a name once when the simulator starts. */
ensurePlayerName();


/* =========================
   START
========================= */

renderDashboard();

</script>
